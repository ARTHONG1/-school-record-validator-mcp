<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트와 School Record Validator MCP의 작동 흐름</title>
  <desc id="desc">교사가 요청하면 AI가 MCP 도구를 호출하고, 규칙팩과 공식 근거를 확인한 뒤 결과를 반환하는 세 단계 흐름</desc>
  <rect width="900" height="320" rx="8" fill="#f7faf9"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="42" y="74" width="210" height="170" rx="8" fill="#fff" stroke="#c9d8d3" stroke-width="2"/>
    <circle cx="147" cy="118" r="27" fill="#e4f2ec"/><path d="M135 118h24M147 106v24" stroke="#176b52" stroke-width="4" stroke-linecap="round"/>
    <text x="147" y="172" font-size="22" font-weight="700" fill="#16332a">교사의 요청</text><text x="147" y="203" font-size="15" fill="#536760">문안을 점검해줘</text>
    <path d="M275 159h80" stroke="#2878a8" stroke-width="4"/><path d="m344 148 16 11-16 11" fill="none" stroke="#2878a8" stroke-width="4"/>
    <rect x="345" y="48" width="210" height="222" rx="8" fill="#fff" stroke="#aec8df" stroke-width="2"/>
    <rect x="373" y="76" width="154" height="34" rx="5" fill="#e8f2f9"/><text x="450" y="99" font-size="16" font-weight="700" fill="#205b80">AI 에이전트</text>
    <text x="450" y="147" font-size="15" fill="#536760">MCP 도구 선택</text><text x="450" y="174" font-size="15" fill="#536760">입력 스키마 전달</text><text x="450" y="201" font-size="15" fill="#536760">결과 해석</text>
    <path d="M578 159h80" stroke="#2878a8" stroke-width="4"/><path d="m647 148 16 11-16 11" fill="none" stroke="#2878a8" stroke-width="4"/>
    <rect x="648" y="74" width="210" height="170" rx="8" fill="#fff" stroke="#c9d8d3" stroke-width="2"/>
    <circle cx="753" cy="118" r="27" fill="#e4f2ec"/><path d="m739 118 9 9 19-22" fill="none" stroke="#176b52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="753" y="172" font-size="22" font-weight="700" fill="#16332a">검증 결과</text><text x="753" y="203" font-size="15" fill="#536760">근거와 권고 반환</text>
  </g>
</svg>
