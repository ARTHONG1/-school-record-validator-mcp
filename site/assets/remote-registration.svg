<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Remote MCP 등록 예시</title>
  <desc id="desc">이름과 MCP URL을 입력하고 HTTP transport를 선택하는 등록 화면 예시</desc>
  <rect width="900" height="520" rx="8" fill="#eef2f5"/><rect x="180" y="34" width="540" height="452" rx="8" fill="#fff" stroke="#d0d9df" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#1d3029"><text x="222" y="84" font-size="25" font-weight="700">새 MCP 추가</text><text x="222" y="131" font-size="15">이름</text><rect x="222" y="143" width="456" height="44" rx="5" fill="#fff" stroke="#bac8c4"/><text x="240" y="171" font-size="15">학교생활기록부 검증기</text>
  <text x="222" y="227" font-size="15">URL</text><rect x="222" y="239" width="456" height="44" rx="5" fill="#fff" stroke="#bac8c4"/><text x="240" y="267" font-size="13" fill="#315e52">https://...run.app/mcp</text>
  <text x="222" y="324" font-size="15">Transport</text><circle cx="246" cy="352" r="8" fill="#fff" stroke="#a8b5b1" stroke-width="2"/><text x="263" y="357" font-size="14">SSE</text><circle cx="330" cy="352" r="8" fill="#2878a8"/><circle cx="330" cy="352" r="3" fill="#fff"/><text x="347" y="357" font-size="14">HTTP</text>
  <rect x="222" y="404" width="456" height="48" rx="5" fill="#176b52"/><text x="450" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">생성하기</text></g>
</svg>
